services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: animehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: animehub
    ports:
      - "5432:5432"
    volumes:
      - animehub_data:/var/lib/postgresql/data
volumes:
  animehub_data:
