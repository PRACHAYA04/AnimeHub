<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg?v=anime-center-play" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico?v=anime-center-play" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('anime-center.theme') === 'dark') theme = 'dark';
        } catch (_) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#000000' : '#fafafa');
      })();
    </script>
    <meta name="description" content="Anime Center ค้นพบอนิเมะ เก็บเรื่องโปรด และแบ่งปันรีวิว" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=anime-center-play" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=anime-center-play" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Anime Center</title>
  </head>
  <body>
    <noscript>ต้องเปิด JavaScript เพื่อใช้งานเว็บนี้</noscript>
    <div id="root"></div>
  </body>
</html>
